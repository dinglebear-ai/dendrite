name: Validate marketplaces

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  marketplace:
    uses: dinglebear-ai/workflows/.github/workflows/marketplace-ci.yml@d7bbe71ddc1157e32ed0bebf928fc07438ba58b0
    with:
      validation-command: plugins/scripts/check-all
      cli-install-command: >-
        npm install --global
        @anthropic-ai/claude-code@2.1.220
        @openai/codex@0.144.6
        @google/gemini-cli@0.47.0
      smoke-command: plugins/scripts/smoke-marketplace-install

  contract:
    uses: dinglebear-ai/workflows/.github/workflows/fleet-contract.yml@d7bbe71ddc1157e32ed0bebf928fc07438ba58b0
    with:
      profile: ops

  workflow-policy:
    uses: dinglebear-ai/workflows/.github/workflows/fleet-policy.yml@d7bbe71ddc1157e32ed0bebf928fc07438ba58b0

  validate:
    name: Validate
    if: always()
    needs: [marketplace, contract, workflow-policy]
    runs-on: [self-hosted, ci-pool-ops]
    timeout-minutes: 5
    steps:
      - name: Require all marketplace checks
        env:
          MARKETPLACE: ${{ needs.marketplace.result }}
          CONTRACT: ${{ needs.contract.result }}
          WORKFLOW_POLICY: ${{ needs.workflow-policy.result }}
        run: |
          test "$MARKETPLACE" = success
          test "$CONTRACT" = success
          test "$WORKFLOW_POLICY" = success
